# Builds FocusStudy.exe on every push / pull request.
# Pushing a tag like v1.0.0 also attaches the exe to a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish x64 exe (Intel / AMD)
        shell: pwsh
        run: ./publish.ps1 -Runtime win-x64

      - name: Publish ARM64 exe (Snapdragon / Copilot+ PCs)
        shell: pwsh
        run: |
          ./publish.ps1 -Runtime win-arm64
          Copy-Item dist-arm64/FocusStudy.exe dist/FocusStudy-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FocusStudy
          path: |
            dist/FocusStudy.exe
            dist/FocusStudy-arm64.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FocusStudy.exe
            dist/FocusStudy-arm64.exe
